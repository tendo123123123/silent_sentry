<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569" /></marker>
</defs>
<rect x="0" y="0" width="1800" height="1100" fill="#fbfbfd" />
<text x="40" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">
<tspan x="40" dy="0">Silent Sentry - Mathematical Methods in the Codebase</tspan>
</text>
<text x="40" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#4b5563">
<tspan x="40" dy="0">Algorithms actually implemented in the active stack and their relationship</tspan>
</text>
<rect x="60" y="120" rx="16" ry="16" width="360" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="74" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="74" dy="0">Vehicle Kinematics</tspan>
</text>
<text x="74" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="74" dy="0">Ackermann bicycle geometry</tspan>
<tspan x="74" dy="20">delta = atan(L * omega / v)</tspan>
<tspan x="74" dy="20">inner/outer steering and wheel</tspan>
<tspan x="74" dy="20">speed split</tspan>
</text>
<rect x="500" y="120" rx="16" ry="16" width="360" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="514" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="514" dy="0">Terramechanics</tspan>
</text>
<text x="514" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="514" dy="0">Bekker sinkage, effective</tspan>
<tspan x="514" dy="20">radius, slip ratio, understeer</tspan>
<tspan x="514" dy="20">model, gyro bias Kalman filter,</tspan>
<tspan x="514" dy="20">ZUPT / stall logic</tspan>
</text>
<rect x="940" y="120" rx="16" ry="16" width="360" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="954" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="954" dy="0">Factor Graph</tspan>
</text>
<text x="954" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="954" dy="0">GTSAM Pose3 / Rot3 / NavState</tspan>
<tspan x="954" dy="20">ImuFactor + BetweenFactorPose3 +</tspan>
<tspan x="954" dy="20">priors</tspan>
<tspan x="954" dy="20">iSAM2 incremental smoothing</tspan>
</text>
<rect x="1380" y="120" rx="16" ry="16" width="360" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="1394" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="1394" dy="0">Local DEM Frontend</tspan>
</text>
<text x="1394" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="1394" dy="0">Azimuth-time deskew, gravity</tspan>
<tspan x="1394" dy="20">alignment, self-hit masking,</tspan>
<tspan x="1394" dy="20">RANSAC ground fit, rasterization</tspan>
</text>
<rect x="280" y="520" rx="16" ry="16" width="420" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="294" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="294" dy="0">TRN Matching</tspan>
</text>
<text x="294" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="294" dy="0">Dynamic ROI, bilateral filter,</tspan>
<tspan x="294" dy="20">particle motion update, MAD</tspan>
<tspan x="294" dy="20">likelihood, ESS resampling, AMCL-style</tspan>
<tspan x="294" dy="20">recovery</tspan>
</text>
<rect x="860" y="520" rx="16" ry="16" width="420" height="260" fill="#ecfdf5" stroke="#334155" stroke-width="3" />
<text x="874" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="874" dy="0">Learning Component</tspan>
</text>
<text x="874" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="874" dy="0">CLIP zero-shot image-text scoring for</tspan>
<tspan x="874" dy="20">terrain classes; softmax over prompt</tspan>
<tspan x="874" dy="20">set</tspan>
</text>
<rect x="1380" y="520" rx="16" ry="16" width="320" height="260" fill="#ffe9e2" stroke="#334155" stroke-width="3" />
<text x="1394" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="1394" dy="0">Inactive LiDAR-Inertial Branch</tspan>
</text>
<text x="1394" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="1394" dy="0">Upstream LIO-SAM package</tspan>
<tspan x="1394" dy="20">exists but is not on the</tspan>
<tspan x="1394" dy="20">active terramechanic launch</tspan>
<tspan x="1394" dy="20">path</tspan>
</text>
<line x1="420" y1="250" x2="500" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="379" y="236" width="162" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="389" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="389" dy="0">wheel motion model</tspan>
</text>
<line x1="860" y1="250" x2="940" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="801" y="236" width="198" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="811" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="811" dy="0">local state estimation</tspan>
</text>
<line x1="1300" y1="250" x2="1380" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="1277" y="236" width="126" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="1287" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="1287" dy="0">LiDAR frontend</tspan>
</text>
<line x1="680" y1="380" x2="490" y2="520" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="535" y="436" width="100" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="545" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="545" dy="0">odom prior</tspan>
</text>
<line x1="1560" y1="380" x2="490" y2="520" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="971" y="436" width="108" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="981" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="981" dy="0">DEM evidence</tspan>
</text>
<line x1="1070" y1="380" x2="1070" y2="520" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="994" y="436" width="153" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="1004" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="1004" dy="0">perception branch</tspan>
</text>
<text x="40" y="1088" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4b5563">
<tspan x="40" dy="0">Generated from current repo structure and active launch paths</tspan>
</text>
</svg>