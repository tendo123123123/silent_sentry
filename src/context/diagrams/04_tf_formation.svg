</text>
<text x="1194" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="1194" dy="0">odom_visualizer, comparator,</tspan>
<tspan x="1194" dy="20">local_dem_builder, RViz, downstream</tspan>
<tspan x="1194" dy="20">navigation</tspan>
</text>
