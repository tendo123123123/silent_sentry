<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569" /></marker>
</defs>
<rect x="0" y="0" width="1800" height="1100" fill="#fbfbfd" />
<text x="40" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">
<tspan x="40" dy="0">Silent Sentry - TF Formation</tspan>
</text>
<text x="40" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#4b5563">
<tspan x="40" dy="0">Which nodes contribute to the runtime frame tree and how consumers obtain the final localized pose</tspan>
</text>
<rect x="730" y="80" rx="16" ry="16" width="300" height="150" fill="#eef2ff" stroke="#334155" stroke-width="3" />
<text x="744" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="744" dy="0">map</tspan>
</text>
<text x="744" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="744" dy="0">global correction frame</tspan>
</text>
<rect x="730" y="300" rx="16" ry="16" width="300" height="150" fill="#eef2ff" stroke="#334155" stroke-width="3" />
<text x="744" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="744" dy="0">odom</tspan>
</text>
<text x="744" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
