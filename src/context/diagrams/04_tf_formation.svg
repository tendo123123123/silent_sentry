<text x="744" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="744" dy="0">base_footprint</tspan>
</text>
<text x="744" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="744" dy="0">robot body frame for</tspan>
<tspan x="744" dy="20">localization</tspan>
</text>
<rect x="220" y="300" rx="16" ry="16" width="360" height="180" fill="#e9fbe7" stroke="#334155" stroke-width="3" />
<text x="234" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="234" dy="0">TRN SLAM Node</tspan>
</text>
<text x="234" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="234" dy="0">publishes map-&gt;odom from DEM</tspan>
<tspan x="234" dy="20">matching and MCL correction</tspan>
</text>
<rect x="220" y="520" rx="16" ry="16" width="360" height="180" fill="#e9fbe7" stroke="#334155" stroke-width="3" />
<text x="234" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="234" dy="0">Factor Graph Fuser</tspan>
</text>
<text x="234" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="234" dy="0">publishes odom-&gt;base_footprint</tspan>
<tspan x="234" dy="20">from wheel + IMU fusion</tspan>
</text>
<rect x="1180" y="520" rx="16" ry="16" width="430" height="220" fill="#fef3c7" stroke="#334155" stroke-width="3" />
<text x="1194" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
<tspan x="1194" dy="0">Robot State Publisher</tspan>
</text>
<text x="1194" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#243042">
<tspan x="1194" dy="0">publishes kinematic tree below</tspan>
<tspan x="1194" dy="20">base_footprint: base_link, wheels,</tspan>
<tspan x="1194" dy="20">steering joints, imu_link, laser_link,</tspan>
<tspan x="1194" dy="20">camera frames</tspan>
</text>
<rect x="1180" y="210" rx="16" ry="16" width="430" height="180" fill="#ffe9e2" stroke="#334155" stroke-width="3" />
<text x="1194" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
