<rect x="830" y="471" width="100" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="840" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="840" dy="0">local pose</tspan>
</text>
<line x1="1030" y1="595" x2="1180" y2="595" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="1055" y="581" width="100" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="1065" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="1065" dy="0">base-&gt;links</tspan>
</text>
<line x1="1030" y1="375" x2="1180" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)" />
<rect x="1024" y="323" width="162" height="28" rx="8" ry="8" fill="#ffffff" stroke="#e6e8ee" />
<text x="1034" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0f766e">
<tspan x="1034" dy="0">map-&gt;base composed</tspan>
</text>
<text x="40" y="1088" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4b5563">
