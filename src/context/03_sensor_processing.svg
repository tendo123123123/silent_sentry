<tspan x="76" dy="20">- raw IMU -&gt; Madgwick attitude</tspan>
<tspan x="76" dy="20">Estimator use:</tspan>
<tspan x="76" dy="20">- gravity compensation</tspan>
<tspan x="76" dy="20">- stall and ZUPT logic</tspan>
<tspan x="76" dy="20">- roll and pitch priors + PIM</tspan>
</text>
