<text x="68" y="1138" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#243042">
<tspan x="68" dy="0">Each sensing modality serves a distinct role: IMU stabilizes attitude,</tspan>
<tspan x="68" dy="19">joints drive local motion, LiDAR supports DEM/TRN localization, and camera</tspan>
<tspan x="68" dy="19">changes planning context rather than pose estimation.</tspan>
</text>
<text x="68" y="1188" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">
<tspan x="68" dy="0">Solid arrows = primary runtime flow    Dashed arrows = commands, fallbacks, or diagnostic-only links</tspan>
</text>
