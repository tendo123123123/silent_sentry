<tspan x="531" dy="20">- sinkage and slip estimation</tspan>
<tspan x="531" dy="20">- gyro-aided yaw-rate fusion</tspan>
<tspan x="531" dy="20">Outputs:</tspan>
<tspan x="531" dy="20">- /terramechanic_odom</tspan>
</text>
