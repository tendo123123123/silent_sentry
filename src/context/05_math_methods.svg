<text x="68" y="1138" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#243042">
<tspan x="68" dy="0">The active architecture is a hybrid of Ackermann kinematics,</tspan>
<tspan x="68" dy="19">terramechanics, GTSAM dead reckoning, DEM-based terrain matching, and</tspan>
<tspan x="68" dy="19">zero-shot terrain classification. It is not SE(3)-LIO.</tspan>
</text>
