# LiDAR point cloud
- ros_topic_name: "scan/points"
  gz_topic_name: "/{bot_name}/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Ground truth model pose — /model/{bot_name}/pose publishes gz.msgs.Pose (singular)
# which bridges cleanly to geometry_msgs/Pose. This gives the robot's absolute
# world pose directly with no ambiguity (unlike Pose_V which contains all world objects
# with empty child_frame_id in the TFMessage conversion).
- ros_topic_name: "ground_truth/pose"
  gz_topic_name: "/model/{bot_name}/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
