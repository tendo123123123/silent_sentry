controller_server:
  ros__parameters:
    use_sim_time: true
    # 20 Hz was never met (sim at RTF 100% starves Nav2 -> actual ~2.2 Hz,
    # "Planner loop missed its desired rate"). 10 Hz is ample for a 0.5 m/s
    # patrol and stops the flood of rate-miss warnings + jerky control.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5           # 0.3 -> 0.5: more slack before aborting to recovery
    # REQUIRED in Jazzy: without these top-level plugin lists the
    # controller_server aborts on configure (crash observed as
    # "controller_server has stopped unexpectedly").
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0   # 15 -> 10: detect "stuck" faster, fail goal sooner
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Ackermann patrol: reaching the waypoint position matters, final
      # heading does not, so the yaw tolerance is deliberately loose.
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      
      # --- Lookahead Logic ---
      # Logic: For a 1.4m robot, looking too close (0.6m) makes it twitchy. 
      # Looking too far (3.0m) makes it cut corners.
      lookahead_dist: 1.5          # Adjusted for your 0.9m wheelbase
      min_lookahead_dist: 0.8       # Never look closer than ~1 wheelbase
      max_lookahead_dist: 3.5
      lookahead_time: 1.5           # Look 1.5s into the future
      use_velocity_scaled_lookahead_dist: true
      
      # --- Ackermann: NEVER rotate in place ---
      # Car-like robot cannot spin on the spot. If RPP rotates to heading it
      # emits linear=0 + angular!=0; the ackermann controller then computes
      # zero wheel velocity and the robot FREEZES (observed:
      # "CMD: linear=0.00 -> corrected=0.00, angular=-0.08"). Must be false.
      use_rotate_to_heading: false

      # Reverse allowed (planner rarely emits it due to reverse_penalty=5.0),
      # so RPP can execute the occasional reverse segment for tight extractions.
      allow_reversing: true

      # --- Collision safety ---
      # Stop before hitting: project the commanded velocity forward and halt if
      # it would collide within this horizon. Gives smooth slow-then-stop
      # instead of driving into a freshly-sensed obstacle.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0   # 1.5 -> 1.0: less eager stop on distant/edge cost

      # RPP scales speed on curvature so sharp arcs slow down (smoother).
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.36   # Your R_min
      regulated_linear_scaling_min_speed: 0.4     # Minimum "crawl" speed so it doesn't get stuck
      
      # --- Cost Awareness ---
      # DISABLED: with the over-marked terrain costmap the robot footprint sits
      # in inflated cost almost everywhere, so cost-regulated scaling drove the
      # commanded speed to ~0 (permanent crawl/freeze). Curvature regulation +
      # inflation avoidance are enough; re-enable only after obstacle marking
      # is cleaned up (C++ ugv_obstacle DEM-prior detector).
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.6        # Start slowing down when 60cm from an obstacle
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      
      # --- Ackermann Specifics ---
      # Logic: If the path is too sharp, RPP will normally stop. 
      # We want it to attempt the turn instead of timing out.
      max_angular_accel: 1.5
      # 0.5 -> 2.0: the map->odom TF from the factor-graph fuser arrives in
      # bursts under load, producing gaps up to ~1.7 s ("Transform data too old
      # when converting from map to odom"). 2.0 s rides over those gaps instead
      # of aborting the controller.
      transform_tolerance: 2.0
      
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 2.0   # 1.0 -> 2.0: absorb bursty map->odom TF (see FollowPath note)
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 10            # Increased for larger robot (1.4m x 0.8m)
      height: 10           # Increased for larger robot
      resolution: 0.1
      # Remove robot_radius: 0.7
      footprint: "[[-0.7, -0.4], [0.7, -0.4], [0.7, 0.4], [-0.7, 0.4]]"             # Conservative radius based on robot dimensions (1.4m x 0.8m)
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # Steeper cost scaling for better path planning
        inflation_radius: 0.45      # 0.5 -> 0.45: just over robot half-width (0.4m) + margin
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false   # 3D voxel viz is pure overhead; off = less CPU
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        # 3D obstacle cloud from ground_segmentation_node: slopes already
        # removed, so only true obstacles (rocks/vegetation) are marked.
        observation_sources: pointcloud
        pointcloud:
          topic: /scan/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          # MUST be >= ugv_obstacle self_radius (1.0 m). Points inside that
          # radius are filtered out of /scan/obstacles, but with
          # raytrace_min_range 0.0 the clearing rays still swept through the
          # blind zone and ERASED obstacles the robot was about to hit. Not
          # clearing inside 1.0 m preserves that obstacle memory on approach.
          raytrace_min_range: 1.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # false: send only the update window each cycle instead of the whole
      # costmap. Cuts serialization/publish load that was starving the
      # controller loop (2.2 Hz -> target).
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 2.0   # absorb bursty map->odom TF; also stops laser Message Filter drops
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      footprint: "[[-0.7, -0.4], [0.7, -0.4], [0.7, 0.4], [-0.7, 0.4]]"
      # ROLLING WINDOW: 140x140 m @0.4 m = 350x350 = ~122k cells. Half-window
      # (70 m) now exceeds SBLP l_max (35 m) with margin, so goals always land
      # inside the reachable window (fixes repeated "no valid path found" when
      # l_max==half-window). 0.4 m resolution keeps the larger window real-time
      # for Smac Hybrid-A*.
      rolling_window: true
      width: 140
      height: 140
      resolution: 0.4
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # 3D obstacle cloud (slopes removed by ground_segmentation_node).
        observation_sources: pointcloud
        pointcloud:
          topic: /scan/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 1.0   # >= self_radius; see local_costmap note
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # Steeper cost scaling for better path planning
        # MUST be >= the footprint's circumscribed radius (0.82 m for the
        # 1.4x0.8 m chassis). Smac Hybrid-A* uses the inflation potential field
        # to skip full-footprint SE2 collision checks; with 0.6 m it lost that
        # optimization ("inflation radius is smaller than the circumscribed
        # radius ... will substantially impact run-time performance") and then
        # timed out -> "no valid path found" on every goal. Do not lower this.
        inflation_radius: 0.9
      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: true
    # Map file will be provided by launch file parameter
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    publish_expansions: true
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # REEDS_SHEPP keeps reverse available for tight spots (dead-ends,
      # cornering), but reverse_penalty is high so the planner only reverses
      # when a forward solution doesn't exist. Prevents the constant
      # back-first behaviour while retaining reverse as a genuine last resort.
      motion_model_for_search: "REEDS_SHEPP"
      tolerance: 0.5
      minimum_turning_radius: 3.36
      reverse_penalty: 5.0         # strongly prefer forward; reverse only if needed
      change_penalty: 0.8
      bend_penalty: 2.0
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      allow_unknown: true
      analytic_expansion_ratio: 3.5    # default (was 2.0 to force reversing)
      analytic_expansion_max_length: 20.0
      angle_quantization_bins: 48     # 72 -> 48 (7.5°); smaller search space, faster
      search_info:
        # Back to 2000: 800 ms combined with the broken potential field (see
        # inflation_radius) made every search time out. With inflation restored
        # the search is fast again, and the headroom prevents spurious failures
        # on long legs.
        primitive_search_max_duration_ms: 2000

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 2000                   # Increased iterations for better smoothing
      do_refinement: true
      refinement_num: 3               # Multiple refinement passes

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp" 
      backup_speed: 0.15              # Slower backup for safety
      backup_distance: 0.7           # Moderate backup distance
      time_allowance: 10.0            # Longer time allowance
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      max_linear_vel: 0.3             # Conservative velocity
      max_angular_vel: 0.5            # Reduced for stability
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0          # 0.2 -> 1.0: bursty TF broke backup/drive_on_heading
    use_sim_time: true
    simulate_ahead_time: 3.0          # Longer simulation for Ackermann stability
    max_rotational_vel: 0.6           # Reduced for smoother motion  
    min_rotational_vel: 0.15          # Minimum rotation speed
    rotational_acc_lim: 1.5           # Gentler angular acceleration

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0        # Increased frequency for smoother motion
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 0.8]    # Updated for Ackermann: [max_x, max_y, max_theta]
    min_velocity: [-0.8, 0.0, -0.8]  # Allow reverse motion
    max_accel: [1.2, 0.0, 1.8]       # Slightly reduced for smoother acceleration  
    max_decel: [-1.8, 0.0, -2.2]     # More gradual deceleration for comfort
    odom_topic: "/odometry/filtered"  # Use enhanced localization
    odom_duration: 0.15              # Slightly longer for stability
    deadband_velocity: [0.02, 0.0, 0.05]  # Small deadband to reduce jitter
    velocity_timeout: 1.0