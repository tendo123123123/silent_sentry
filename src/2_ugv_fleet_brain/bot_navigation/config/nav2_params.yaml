amcl:
  ros__parameters:
    use_sim_time: true
    # Alpha parameters for Ackermann drive robot (motion noise)
    alpha1: 0.1      # Rotation noise from rotation 
    alpha2: 0.05     # Translation noise from rotation (Ackermann has better rotation tracking)
    alpha3: 0.15     # Translation noise from translation (wheel slip considerations)
    alpha4: 0.1      # Rotation noise from translation
    alpha5: 0.05     # Additional noise parameter
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 2.0         # Increased tolerance for simulation timing issues
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    
    # # Initial pose parameters - set a default pose to break the chicken-egg problem
    # set_initial_pose: true
    # initial_pose.x: 0.0
    # initial_pose.y: 0.0
    # initial_pose.z: 0.0
    # initial_pose.yaw: 0.0
