# =============================================================================
# TRN SLAM v3 Configuration — MCL Backend
# =============================================================================
# Terrain-Referenced Navigation with Monte Carlo Localisation, MAD scoring,
# bilateral filtering, and flat-sand variance gating.
# =============================================================================

trn_slam_node:
  ros__parameters:
    # --- Global DEM ---
    global_dem_path: ""                  # Set dynamically via launch file
    global_dem_res: 1.0
    global_dem_origin_x: -450.0
    global_dem_origin_y: -150.0

    # --- Bilateral Filter (replaces Perona-Malik) ---
    bilateral_d: 9                       # filter diameter (px); -1 = compute from sigma_space
    bilateral_sigma_color: 15.0          # filter sigma in elevation domain (m)
    bilateral_sigma_space: 75.0          # filter sigma in spatial domain (px)

    # --- Dynamic ROI Cropping ---
    # DO NOT RAISE base/initial BACK TO 15.0. Commit 65bd054 deliberately
    # lowered these 15.0 -> 5.0; they were briefly reverted to 15.0 and that
    # measurably made drift worse. base_search_radius is NOT only an ROI gate --
    # trn_core.cpp also uses it to scale the AMCL recovery injection:
    #     rec_x(map_prior.x(), config_.base_search_radius * 0.5)
    # so 5.0 -> sigma 2.5 m but 15.0 -> sigma 7.5 m, scattering 10% of the 800
    # particles (amcl_random_fraction) at 3x the noise amplitude on EVERY
    # resample. The published covariance is the posterior particle spread, so a
    # 3x wider cloud inflates variance ~9x; after the fuser's 0.1 scaling the
    # TRN prior becomes so loose (sigma ~4.9 m) that the factor graph
    # effectively ignores it, and the fused estimate collapses onto raw wheel
    # odometry. On self-similar dune terrain a wider search does not recover the
    # true peak -- the NCC surface is nearly flat, so extra area only adds more
    # equally-plausible wrong candidates.
    base_search_radius: 5.0
    max_search_radius: 30.0
    initial_search_radius: 5.0

    # --- MCL Particle Filter ---
    num_particles: 800                   # number of particles (more = better coverage)
    ess_threshold: 0.40                  # resample only after the particle set has genuinely lost support; avoids unnecessary panic churn
    flatness_std_threshold: 0.05         # abort match when local DEM std-dev is below this
    amcl_random_fraction: 0.10           # AMCL style random recovery fraction

    # --- Persistent MCL Motion Model ---
    motion_noise_xy_frac: 0.15           # position noise = displacement * frac (+ 5cm floor)
    motion_noise_yaw_frac: 0.10          # yaw noise     = |dyaw| * frac (+ 0.005 rad floor)

    # --- Match Gating ---
    # Restored to the pre-session baseline (0.8 / 0.65). These were briefly
    # raised to 1.2 / 0.70 alongside the search-radius change; since that batch
    # made drift worse, all four values are back at baseline so there is a clean
    # reference to A/B against. Change ONE of these at a time, and measure ATE.
    entropy_threshold: 0.8
    min_peak_quality: 0.65               # minimum NCC likelihood to accept correction (NCC scale: 0.5=uncorrelated, 1.0=perfect)

    # --- Coordinate Frames ---
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
