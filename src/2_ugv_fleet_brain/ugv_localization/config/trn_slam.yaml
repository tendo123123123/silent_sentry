# =============================================================================
# TRN SLAM v3 Configuration — MCL Backend
# =============================================================================
# Terrain-Referenced Navigation with Monte Carlo Localisation, MAD scoring,
# bilateral filtering, and flat-sand variance gating.
# =============================================================================

trn_slam_node:
  ros__parameters:
    # --- Global DEM ---
    global_dem_path: ""                  # Set dynamically via launch file
    global_dem_res: 1.0
    global_dem_origin_x: -450.0
    global_dem_origin_y: -150.0

    # --- Bilateral Filter (replaces Perona-Malik) ---
    bilateral_d: 9                       # filter diameter (px); -1 = compute from sigma_space
    bilateral_sigma_color: 15.0          # filter sigma in elevation domain (m)
    bilateral_sigma_space: 75.0          # filter sigma in spatial domain (px)

    # --- Dynamic ROI Cropping ---
    # base/initial raised 5.0 -> 15.0 (code default). At 5 m, once dead-reckoning
    # drift exceeded ~5 m the true correction peak fell OUTSIDE the search ROI,
    # so the matcher locked onto a wrong local peak and error ran away
    # (observed: ATE climbs past 6 m after ~100 s). 15 m keeps the true peak in
    # view through normal drift; adaptive expansion still reaches max_search_radius.
    base_search_radius: 15.0
    max_search_radius: 30.0
    initial_search_radius: 15.0

    # --- MCL Particle Filter ---
    num_particles: 800                   # number of particles (more = better coverage)
    ess_threshold: 0.40                  # resample only after the particle set has genuinely lost support; avoids unnecessary panic churn
    flatness_std_threshold: 0.05         # abort match when local DEM std-dev is below this
    amcl_random_fraction: 0.10           # AMCL style random recovery fraction

    # --- Persistent MCL Motion Model ---
    motion_noise_xy_frac: 0.15           # position noise = displacement * frac (+ 5cm floor)
    motion_noise_yaw_frac: 0.10          # yaw noise     = |dyaw| * frac (+ 0.005 rad floor)

    # --- Match Gating ---
    # entropy_threshold raised 0.8 -> 1.2: below this the local DEM is too
    # featureless (flat sand) to match reliably, so the cycle aborts and the
    # filter dead-reckons THROUGH the flat patch instead of accepting an
    # aliased match on repetitive dunes (the cause of confident-but-wrong
    # locks: MAD likelihood ~1.0 while ATE grows). Code default is 1.8; 1.2 is
    # a middle ground — raise toward 1.8 if false locks persist, lower if the
    # matcher aborts so often that dead-reckoning drift dominates.
    entropy_threshold: 1.2
    min_peak_quality: 0.70               # 0.65 -> 0.70: reject marginal matches; NCC scale 0.5=uncorrelated, 1.0=perfect

    # --- Coordinate Frames ---
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
