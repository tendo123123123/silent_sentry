# =============================================================================
# Factor Graph Fuser Configuration — GTSAM iSAM2 SE(3) Dead-Reckoning Backend
# =============================================================================
factor_graph_fuser:
  ros__parameters:
    # --- Output Rate ---
    publish_rate: 50.0                    # Hz

    # --- Noise Parameters (C++ API matches) ---
    imu_accel_noise: 0.35                 # m/s^1.5
    imu_gyro_noise: 0.08                  # rad/s^0.5
    imu_integration_noise: 0.01           # continuous integration noise
    imu_accel_bias_noise: 0.005           # accel bias random walk
    imu_gyro_bias_noise: 0.001            # gyro bias random walk

    initial_pose_sigma: 1.0               # Allow TRN to correct from the start
    initial_vel_sigma: 1e-4
    initial_bias_sigma: 1e-4

    # --- Slip Gating & Multiplier ---
    slip_accel_threshold: 1.5            # m/s^2 wheel-vs-IMU accel mismatch gate
    slip_cov_multiplier: 25.0            # covariance inflation during slip

    # --- Wheel Odometry Sigmas [rot_x, rot_y, rot_z, trans_x, trans_y, trans_z] ---
    # Decouple raw_odom completely from rotation. We rely on the IMU for orientation
    # and the wheels purely for 2D translation (Vx, Vy). We use a loose sigma (0.25)
    # for forward speed (X) to avoid hardcoding wheel radius. The IMU preintegration
    # (calibrated by TRN loop closures) will naturally govern the true speed scale!
    odom_sigmas: [1000.0, 1000.0, 1000.0, 0.25, 1000.0, 1000.0]

    # --- Coordinate Frames ---
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
